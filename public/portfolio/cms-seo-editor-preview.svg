<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Podgląd edycji SEO podstrony w panelu CMS</title>
  <desc id="desc">Ciemny panel CMS z zakładkami podstron, przyciskami zapisu oraz polami SEO title, OG title i SEO description.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#171827"/>
      <stop offset="1" stop-color="#151327"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25d9ef"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.09 0 0 0 0 0.83 0 0 0 0 0.93 0 0 0 .45 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="18" fill="#070b18"/>
  <rect x="9" y="9" width="1182" height="657" rx="14" fill="url(#panel)" stroke="#2d3449" stroke-width="2"/>

  <g transform="translate(44 50)">
    <text x="0" y="0" fill="#58e7f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="800" letter-spacing="7">EDYCJA SEKCJI</text>
    <text x="0" y="48" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900">Treści podstron</text>
  </g>

  <g transform="translate(807 57)">
    <rect width="171" height="52" rx="10" fill="#22d3ee" filter="url(#softGlow)"/>
    <text x="49" y="33" fill="#03111d" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900">Zapisz draft</text>
    <path d="M24 16h15l7 7v18H24z" fill="none" stroke="#04131e" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M29 16v10h11" fill="none" stroke="#04131e" stroke-width="2.2"/>
    <path d="M30 36h10" stroke="#04131e" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <g transform="translate(989 57)">
    <rect width="168" height="52" rx="10" fill="#0b3341" stroke="#2ebed0"/>
    <text x="52" y="33" fill="#d7fbff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900">Opublikuj</text>
    <path d="M31 33v-9a8 8 0 0 1 16 0v9" fill="none" stroke="#d7fbff" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M25 30l6-6 6 6" fill="none" stroke="#d7fbff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 30l-6-6-6 6" fill="none" stroke="#d7fbff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <line x1="44" y1="145" x2="1157" y2="145" stroke="#2b3144"/>

  <g transform="translate(44 176)">
    <rect width="166" height="47" rx="10" fill="#22d3ee"/>
    <text x="21" y="30" fill="#06101e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="900">Strony i CMS</text>
    <rect x="176" width="231" height="47" rx="10" fill="#1a1d2b" stroke="#343a4d"/>
    <text x="196" y="30" fill="#f8fbff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="900">QA i automatyzacja</text>
    <rect x="417" width="115" height="47" rx="10" fill="#1a1d2b" stroke="#343a4d"/>
    <text x="438" y="30" fill="#f8fbff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="900">GameDev</text>
  </g>

  <g transform="translate(44 248)">
    <rect width="1113" height="400" rx="12" fill="#1a1d2b" stroke="#343a4d"/>
    <text x="20" y="46" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">SEO podstrony</text>

    <text x="20" y="95" fill="#f8fbff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">SEO title</text>
    <rect x="20" y="112" width="525" height="51" rx="10" fill="#080d1d" stroke="#252c40"/>
    <text x="36" y="145" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18">Strony internetowe i lekki CMS | Dominik Sadzik</text>
    <text x="20" y="185" fill="#6f7f9b" font-family="Inter, Arial, sans-serif" font-size="16">Najlepiej ok. 60-70 znaków.</text>

    <text x="565" y="95" fill="#f8fbff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">OG title</text>
    <rect x="565" y="112" width="525" height="51" rx="10" fill="#080d1d" stroke="#252c40"/>
    <text x="581" y="145" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18">Strony internetowe i lekki CMS</text>

    <text x="20" y="226" fill="#f8fbff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">SEO description</text>
    <rect x="20" y="243" width="1070" height="139" rx="10" fill="#080d1d" stroke="#252c40"/>
    <text x="36" y="279" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18">Nowoczesne strony internetowe, wizytówki online i lekki panel CMS do edycji treści, SEO, FAQ, kontaktu i statystyk.</text>
    <text x="20" y="412" fill="#6f7f9b" font-family="Inter, Arial, sans-serif" font-size="16">Najlepiej ok. 150-170 znaków.</text>
  </g>
