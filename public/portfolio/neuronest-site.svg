    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="10" r="3.5" fill="#efd6e7" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="#dfe8ea"/>
