<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Podglad strony Centrum Terapii Neuronest</title>
  <desc id="desc">Jasny mockup strony uslugowej z nawigacja, kartami oferty i sekcja szczegolow.</desc>
  <defs>
