<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Podgląd strony demo serwisu domowego</title>
  <desc id="desc">Stylizowany podgląd strony Serwis Blisko z ofertą pomocy komputerowej, kartami usług, procesem i formularzem kontaktowym.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef8ff" />
      <stop offset="0.5" stop-color="#f9fbff" />
      <stop offset="1" stop-color="#ecfff6" />
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1">
      <stop offset="0" stop-color="#1d9bff" />
      <stop offset="1" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f2b46" />
      <stop offset="1" stop-color="#0f5132" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#1d9bff" opacity="0.12" />
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="34" fill="#07111f" />
  <rect x="54" y="42" width="1492" height="816" rx="36" fill="url(#pageBg)" filter="url(#shadow)" />
  <rect x="54" y="42" width="1492" height="816" rx="36" fill="url(#dots)" opacity="0.55" />

  <g transform="translate(96 82)">
    <rect width="1408" height="92" rx="26" fill="#ffffff" opacity="0.92" filter="url(#softShadow)" />
    <g transform="translate(34 20)">
      <rect width="54" height="54" rx="16" fill="url(#brand)" />
      <path d="M18 31h18c6 0 10-4 10-10s-4-10-10-10H19v32" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M20 32h21" stroke="#fff" stroke-width="5" stroke-linecap="round" />
    </g>
    <text x="108" y="43" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">Serwis Blisko</text>
    <text x="108" y="70" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#256d57">Pomoc techniczna w domu</text>
    <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">
      <text x="520" y="55">O firmie</text>
      <text x="624" y="55">Oferta</text>
      <text x="720" y="55">Proces</text>
      <text x="820" y="55">FAQ</text>
      <text x="886" y="55">Kontakt</text>
    </g>
    <rect x="1164" y="18" width="204" height="56" rx="28" fill="url(#brand)" />
    <text x="1210" y="54" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff">Umów termin</text>
  </g>

  <g transform="translate(118 220)">
    <g>
      <rect x="0" y="0" width="272" height="48" rx="24" fill="#dcfce7" />
      <circle cx="30" cy="24" r="8" fill="#22c55e" />
      <text x="52" y="31" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#166534">Wrocław i okolice</text>
    </g>

    <text x="0" y="116" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="950" fill="#0f172a">Serwis komputerowy</text>
    <text x="0" y="190" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="950" fill="#0f5132">i pomoc techniczna</text>
    <text x="0" y="264" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="950" fill="#0f172a">w domu</text>

    <text x="0" y="326" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" fill="#475569">Szybka pomoc przy komputerach, Wi‑Fi i drobnych problemach</text>
    <text x="0" y="364" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" fill="#475569">technicznych w domu oraz małej firmie.</text>

    <g transform="translate(0 414)" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">
      <rect width="220" height="60" rx="30" fill="url(#dark)" />
      <text x="37" y="38" fill="#fff">Umów pomoc</text>
      <rect x="242" width="210" height="60" rx="30" fill="#ffffff" stroke="#cbd5e1" />
      <text x="281" y="38" fill="#0f172a">Zobacz usługi</text>
    </g>

    <g transform="translate(0 526)">
      <rect width="326" height="122" rx="24" fill="#ffffff" filter="url(#softShadow)" />
      <circle cx="58" cy="61" r="26" fill="#e0f2fe" />
      <path d="M45 64h26M49 52h20v19H49z" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="104" y="54" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Dojazd</text>
      <text x="104" y="84" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#64748b">na terenie miasta</text>
    </g>
    <g transform="translate(356 526)">
      <rect width="326" height="122" rx="24" fill="#ffffff" filter="url(#softShadow)" />
      <circle cx="58" cy="61" r="26" fill="#dcfce7" />
      <path d="M46 60h24M58 48v24" stroke="#16a34a" stroke-width="6" stroke-linecap="round" />
      <text x="104" y="54" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Pomoc zdalna</text>
      <text x="104" y="84" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#64748b">szybka diagnoza</text>
    </g>
  </g>

  <g transform="translate(905 220)">
    <rect width="520" height="396" rx="34" fill="#ffffff" filter="url(#shadow)" />
    <rect x="30" y="28" width="460" height="340" rx="26" fill="#f8fafc" />
    <rect x="58" y="58" width="404" height="62" rx="20" fill="url(#dark)" />
    <text x="88" y="98" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#fff">Najczęstsze zgłoszenia</text>

    <g transform="translate(60 148)">
      <rect width="182" height="82" rx="18" fill="#ffffff" stroke="#e2e8f0" />
      <circle cx="42" cy="41" r="20" fill="#e0f2fe" />
      <path d="M32 42h20M36 32h12v21H36z" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="74" y="37" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" fill="#0f172a">Wolny</text>
      <text x="74" y="58" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" fill="#0f172a">laptop</text>
    </g>
    <g transform="translate(278 148)">
      <rect width="182" height="82" rx="18" fill="#ffffff" stroke="#e2e8f0" />
      <circle cx="42" cy="41" r="20" fill="#dcfce7" />
      <path d="M28 37c8-8 20-8 28 0M34 44c5-5 11-5 16 0M42 53h.1" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" />
      <text x="74" y="37" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" fill="#0f172a">Słabe</text>
      <text x="74" y="58" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" fill="#0f172a">Wi‑Fi</text>
    </g>
    <g transform="translate(60 254)">
      <rect width="400" height="82" rx="18" fill="#ffffff" stroke="#e2e8f0" />
      <circle cx="42" cy="41" r="20" fill="#fef3c7" />
      <path d="M34 51l16-18M38 33h12v12" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="78" y="39" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a">Jasna wycena przed pracą</text>
      <text x="78" y="62" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#64748b">diagnoza, zakres i decyzja klienta</text>
    </g>
  </g>

  <g transform="translate(920 650)">
    <rect width="490" height="132" rx="28" fill="#0f172a" opacity="0.94" />
    <text x="34" y="46" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#67e8f9">Demo portfolio</text>
    <text x="34" y="82" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="950" fill="#ffffff">Strona usługowa dla lokalnej marki</text>
    <text x="34" y="110" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#cbd5e1">hero • oferta • proces • FAQ • kontakt • SEO</text>
  </g>
</svg>
