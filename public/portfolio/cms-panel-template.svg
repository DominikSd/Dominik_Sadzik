<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Podglad lekkiego panelu CMS</title>
  <desc id="desc">Ciemny dashboard z edycja tresci, statystykami i statusem publikacji.</desc>
  <defs>
    <linearGradient id="panelBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset=".55" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".36"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="#030712"/>
  <rect x="70" y="56" width="1060" height="638" rx="28" fill="url(#panelBg)" stroke="#1f3b54" filter="url(#panelShadow)"/>
  <rect x="70" y="56" width="1060" height="70" rx="28" fill="#071426"/>
  <circle cx="112" cy="91" r="8" fill="#f87171"/>
  <circle cx="140" cy="91" r="8" fill="#fbbf24"/>
  <circle cx="168" cy="91" r="8" fill="#34d399"/>
  <text x="220" y="99" fill="#dffcff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900">Panel wlasciciela strony</text>
  <rect x="918" y="78" width="160" height="28" rx="14" fill="#103f32"/>
  <text x="954" y="98" fill="#8ef0c4" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">published</text>

  <rect x="102" y="154" width="220" height="500" rx="20" fill="#091827" stroke="#1d3448"/>
  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">
    <rect x="126" y="188" width="172" height="42" rx="12" fill="#10364a"/>
    <text x="154" y="214" fill="#c8f7ff">Strona glowna</text>
    <text x="154" y="272" fill="#8aa6ba">Oferta</text>
    <text x="154" y="326" fill="#8aa6ba">FAQ</text>
    <text x="154" y="380" fill="#8aa6ba">Kontakt</text>
    <text x="154" y="434" fill="#8aa6ba">Statystyki GA4</text>
    <text x="154" y="488" fill="#8aa6ba">Ustawienia</text>
  </g>

  <rect x="354" y="154" width="472" height="500" rx="20" fill="#081827" stroke="#1d3448"/>
  <text x="386" y="204" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">Edycja tresci</text>
  <text x="386" y="236" fill="#9fb5c8" font-family="Inter, Arial, sans-serif" font-size="16">Draft -> publikacja bez ruszania layoutu</text>
  <g transform="translate(386 274)">
    <text y="0" fill="#9fb5c8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">Naglowek sekcji</text>
    <rect y="16" width="380" height="46" rx="12" fill="#0f2438" stroke="#29445d"/>
    <rect x="20" y="33" width="230" height="10" rx="5" fill="#5bd9ee"/>
    <text y="104" fill="#9fb5c8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">Opis</text>
    <rect y="120" width="380" height="126" rx="12" fill="#0f2438" stroke="#29445d"/>
    <rect x="20" y="144" width="320" height="10" rx="5" fill="#5b7185"/>
    <rect x="20" y="170" width="285" height="10" rx="5" fill="#5b7185"/>
    <rect x="20" y="196" width="340" height="10" rx="5" fill="#5b7185"/>
    <rect y="292" width="174" height="44" rx="22" fill="#123047" stroke="#2c506a"/>
    <text x="42" y="320" fill="#dffcff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Zapisz draft</text>
    <rect x="194" y="292" width="174" height="44" rx="22" fill="url(#accent)"/>
    <text x="236" y="320" fill="#031018" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Publikuj</text>
  </g>

  <rect x="858" y="154" width="240" height="150" rx="20" fill="#081827" stroke="#1d3448"/>
  <text x="886" y="196" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">Statystyki</text>
  <path d="M890 258c32-54 58-30 82-58 28-33 54 16 94-24" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
  <rect x="858" y="332" width="240" height="150" rx="20" fill="#081827" stroke="#1d3448"/>
  <text x="886" y="374" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">Auth</text>
  <rect x="886" y="404" width="166" height="14" rx="7" fill="#334b60"/>
  <rect x="886" y="432" width="120" height="14" rx="7" fill="#334b60"/>
  <circle cx="1058" cy="426" r="22" fill="#103f32"/>
  <path d="M1048 426l8 8 16-18" fill="none" stroke="#86efac" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="858" y="510" width="240" height="144" rx="20" fill="#081827" stroke="#1d3448"/>
  <text x="886" y="552" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">Template</text>
  <rect x="886" y="582" width="72" height="48" rx="12" fill="#123047"/>
  <rect x="970" y="582" width="72" height="48" rx="12" fill="#103f32"/>
</svg>
