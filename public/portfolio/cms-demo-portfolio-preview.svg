<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Podgląd demo CMS Studio Harmonia</title>
  <desc id="desc">Stylizowany podgląd panelu administratora Studio Harmonia z menu bocznym, trybem demo, kartami statystyk i szybkimi akcjami.</desc>
  <defs>
    <linearGradient id="cream" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf6" />
      <stop offset="1" stop-color="#f4f0e6" />
    </linearGradient>
    <linearGradient id="sidebar" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d2c23" />
      <stop offset="1" stop-color="#091f19" />
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#079283" />
      <stop offset="1" stop-color="#0f766e" />
    </linearGradient>
    <filter id="cardShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.11" />
    </filter>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="#071a15" />
  <rect x="0" y="0" width="1200" height="675" rx="28" fill="url(#cream)" />

  <g>
    <rect width="280" height="675" fill="url(#sidebar)" />
    <circle cx="39" cy="39" r="21" fill="#f1d7a7" />
    <text x="29" y="46" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="950" fill="#071a15">SH</text>
    <text x="72" y="46" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="950" fill="#ffffff">CMS Demo</text>
    <text x="153" y="46" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#d8c29b">Studio Harmonia</text>
    <line x1="18" y1="78" x2="262" y2="78" stroke="#ffffff" stroke-opacity="0.14" />

    <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">
      <rect x="18" y="95" width="244" height="45" rx="7" fill="#dcece5" />
      <path d="M33 113h6v6h-6zM43 113h6v6h-6zM33 123h6v6h-6zM43 123h6v6h-6z" fill="none" stroke="#0d2c23" stroke-width="1.8" />
      <text x="58" y="124" fill="#0f172a">Dashboard</text>

      <rect x="18" y="149" width="244" height="45" rx="7" fill="#1d342c" />
      <path d="M35 164h10l5 5v14H35zM45 164v6h6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" />
      <text x="58" y="179" fill="#ffffff">Strony</text>

      <rect x="18" y="202" width="244" height="45" rx="7" fill="#1d342c" />
      <path d="M34 217h14v16H34zM38 213h14v16" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" />
      <text x="58" y="231" fill="#ffffff">Aktualności</text>

      <rect x="18" y="255" width="244" height="45" rx="7" fill="#1d342c" />
      <path d="M33 272h16v14H33zM37 282l4-4 3 3 3-5 3 6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="58" y="284" fill="#ffffff">Media</text>

      <rect x="18" y="308" width="244" height="45" rx="7" fill="#1d342c" />
      <circle cx="39" cy="329" r="7" fill="none" stroke="#ffffff" stroke-width="1.8" />
      <path d="M44 334l7 7" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <text x="58" y="337" fill="#ffffff">SEO</text>

      <rect x="18" y="361" width="244" height="45" rx="7" fill="#1d342c" />
      <path d="M40 375v18M31 384h18M34 378l12 12M46 378l-12 12" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" />
      <text x="58" y="390" fill="#ffffff">Ustawienia</text>

      <rect x="18" y="414" width="244" height="45" rx="7" fill="#1d342c" />
      <path d="M34 431h13v13H34zM42 426h9v9M43 435l9-9" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="58" y="443" fill="#ffffff">Podgląd strony</text>
