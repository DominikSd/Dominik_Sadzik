<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Projekt React/Vite strony Dominika Sadzika. Właściwy punkt startowy aplikacji to index.html."
    />
    <meta http-equiv="refresh" content="0; url=./index.html" />
    <title>Dominik Sadzik — strona przeniesiona do React</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #050816;
        color: #f8fafc;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.2), transparent 32%),
          radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.18), transparent 34%),
          linear-gradient(135deg, #050816, #07111f 45%, #0a0618);
      }

      main {
        width: min(92vw, 560px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 32px;
        background: rgba(15, 23, 42, 0.64);
        box-shadow: 0 24px 80px rgba(37, 99, 235, 0.2);
        backdrop-filter: blur(16px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 7vw, 3.4rem);
        line-height: 1;
      }

      p {
        margin: 0 0 24px;
        color: #cbd5e1;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        border-radius: 999px;
        padding: 14px 20px;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        background: linear-gradient(90deg, #2563eb, #7c3aed);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dominik Sadzik</h1>
      <p>
        Ten plik jest tylko przekierowaniem. Właściwa strona działa jako aplikacja React/Vite przez
        <strong>index.html</strong>.
      </p>
      <a href="./index.html">Przejdź do strony</a>
    </main>
  </body>
</html>
